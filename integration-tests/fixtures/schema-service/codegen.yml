schema: gql/schema.graphql
emitLegacyCommonJSImports: false
pluckConfig:
  modules:
    - name: "#gql/client"
      identifier: graphql
generates:
  gql/_generated/resolvers.ts:
    config:
      contextType: ResolverContext
      enumsAsTypes: true
      useTypeImports: true
    plugins:
      - add:
          content: import type { ResolverContext } from '../context.js';
      - typescript
      - typescript-resolvers
  gql/client/_generated/:
    documents:
      - client/**/*.ts
      - "!client/dist/**"
      - "!**/_generated/**"
    preset: client
    config:
      enumsAsTypes: true
      useTypeImports: true
