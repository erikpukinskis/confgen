name: lint
on: push
concurrency:
  group: check-lint
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-slim
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      - run: corepack enable
      - name: Enable Yarn cache
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            .yarn/unplugged
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --immutable
      - run: yarn check:lint
